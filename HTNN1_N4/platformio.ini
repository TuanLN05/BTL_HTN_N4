
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -Iinclude
    -Iinclude/FreeRTOS-Kernel
    -Ilib/Application/Display
    -Ilib/Application/IPC
    -Ilib/Application/Storage
    -Ilib/Application/RTC
    -Iinclude/Config_peripheral/ADC
    -Iinclude/Config_peripheral/GPIO
    -Iinclude/Config_peripheral/I2C
    -Iinclude/Config_peripheral/I2C_RTOS
    -Ilib/Device/Button
    -Ilib/Device/SH1106
    -Ilib/Device/RTC
    -Ilib/BSP
    -Iinclude/FreeRTOS-Kernel/include
    -Iinclude/FreeRTOS-Kernel/portable/GCC/ARM_CM3
; Limit firmware size to leave the last two 1KB pages for thresholds.
board_upload.maximum_size = 63488

; Compile the sources kept under include and lib explicitly.
build_src_filter =
    -<*>
    +<src/>
    +<lib/Application/>
    +<lib/Device/>
    +<lib/BSP/>
    +<include/Config_peripheral/>
    +<include/FreeRTOS-Kernel/tasks.c>
    +<include/FreeRTOS-Kernel/queue.c>
    +<include/FreeRTOS-Kernel/list.c>
    +<include/FreeRTOS-Kernel/timers.c>
    +<include/FreeRTOS-Kernel/event_groups.c>
    +<include/FreeRTOS-Kernel/stream_buffer.c>
    +<include/FreeRTOS-Kernel/portable/GCC/ARM_CM3/port.c>
    +<include/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
lib_ignore =
    Application
    Device
    BSP

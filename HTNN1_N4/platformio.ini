
[platformio]
default_envs = genericSTM32F103C8
src_dir = .
include_dir = app/inc
lib_dir = middlewares

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
board_build.f_cpu = 8000000L
; Danh hai page cuoi Flash cho ThresholdStore.
board_upload.maximum_size = 63488

; DAPLink (CMSIS-DAP) upload and debugging.
upload_protocol = cmsis-dap
debug_tool = cmsis-dap

; Phai khop voi BOARD_UART_BAUD trong bsp/board.h.
monitor_speed = 115200

; Keep the vendored kernel, Cortex-M3 port and heap_4 selected by library.json.
lib_deps =
    symlink://middlewares/FreeRTOS-Kernel

; Only compile project code here; PlatformIO builds FreeRTOS as a library.
build_src_filter =
    -<*>
    +<main.cpp>
    +<bsp/*.cpp>
    +<hal/src/*.cpp>
    +<app/src/*.cpp>
    +<app/src/*.c>

build_flags =
    -Wl,-u,_printf_float
    -Ibsp
    -Ihal/inc
    -Iapp/inc
    -Imiddlewares/FreeRTOS-Kernel/portable/GCC/ARM_CM3

[env:mock_sensor]
extends = env:genericSTM32F103C8
build_flags = ${env:genericSTM32F103C8.build_flags} -DAPP_MOCK_SENSOR

[env:mock_alarm]
extends = env:genericSTM32F103C8
build_flags = ${env:genericSTM32F103C8.build_flags} -DAPP_MOCK_ALARM

[env:mock_ui]
extends = env:genericSTM32F103C8
build_flags = ${env:genericSTM32F103C8.build_flags} -DAPP_MOCK_UI
